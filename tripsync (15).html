<style>
  #tripsync-root {
    --font-display: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --font-body: -apple-system, 'Segoe UI', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Courier New', monospace;
    --paper: #F3ECDA;
    --paper-dark: #E7DCC1;
    --card: #FBF7EC;
    --ink: #2A2723;
    --ink-soft: #756C5C;
    --red: #B33A2E;
    --blue: #1F4E79;
    --madrid: #C1892E;
    --barcelona: #2E7D6B;
    --paris: #A85273;
    --line: rgba(42,39,35,0.16);
    font-family: var(--font-body);
    background: var(--paper);
    background-image:
      radial-gradient(rgba(42,39,35,0.05) 1px, transparent 1px);
    background-size: 14px 14px;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0 14px 70px;
    box-sizing: border-box;
  }
  #tripsync-root *{ box-sizing: border-box; }
  .ts-wrap{ width: 100%; max-width: 480px; }

  .ts-airmail{ height:10px; margin:0 -14px 22px; background:repeating-linear-gradient(-45deg, var(--red) 0 14px, var(--paper) 14px 20px, var(--blue) 20px 34px, var(--paper) 34px 40px); }

  .ts-h1{ font-family:var(--font-display); font-weight:700; letter-spacing:-0.01em; }

  /* ---- Welcome screen ---- */
  .ts-welcome{ padding-top: 6vh; text-align:center; }
  .ts-eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.18em; color:var(--red); text-transform:uppercase; margin-bottom:10px; }
  .ts-welcome h1{ font-size:38px; margin:0 0 10px; }
  .ts-welcome p{ color:var(--ink-soft); font-size:15px; margin:0 0 30px; line-height:1.55; }
  .ts-card{ background:var(--card); color:var(--ink); border-radius:4px; padding:20px; margin-bottom:14px; border:1px solid var(--line); box-shadow:0 1px 0 rgba(42,39,35,0.05); }
  .ts-btn{ font-family:var(--font-body); font-weight:600; font-size:15px; border:none; border-radius:3px; padding:13px 18px; cursor:pointer; width:100%; transition:transform .1s ease, opacity .15s ease; letter-spacing:.01em; }
  .ts-btn:active{ transform: scale(0.98); }
  .ts-btn-gold{ background:var(--red); color:#fff; }
  .ts-btn-outline{ background:transparent; color:var(--ink); border:1px solid var(--ink); }
  .ts-btn-teal{ background:var(--blue); color:#fff; }
  .ts-input{ width:100%; font-family:var(--font-body); font-size:15px; padding:12px 13px; border-radius:3px; border:1px solid rgba(42,39,35,0.25); background:#fff; color:var(--ink); margin-bottom:10px; }
  .ts-input::placeholder{ color:#a89f8f; }
  .ts-err{ color:var(--red); font-size:13px; margin:-4px 0 10px; font-family:var(--font-mono); }

  /* ---- Trip code: passport ink stamp ---- */
  .ts-stub{ background:transparent; color:var(--ink); position:relative; padding:14px 10px 20px; display:flex; align-items:center; justify-content:center; gap:22px; }
  .ts-stub .ts-stamp{ border:2.5px solid var(--red); border-radius:50%; width:104px; height:104px; display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(-7deg); position:relative; }
  .ts-stub .ts-stamp::before{ content:''; position:absolute; inset:6px; border:1px dashed var(--red); border-radius:50%; }
  .ts-stub .ts-code-label{ font-family:var(--font-mono); font-size:8px; letter-spacing:.12em; color:var(--red); text-transform:uppercase; }
  .ts-stub .ts-code{ font-family:var(--font-mono); font-weight:700; font-size:18px; letter-spacing:.08em; color:var(--red); }
  .ts-copy{ font-family:var(--font-mono); font-size:12px; background:var(--ink); color:var(--paper); border:none; border-radius:3px; padding:9px 14px; cursor:pointer; white-space:nowrap; }

  /* ---- App shell ---- */
  .ts-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; padding-top:18px; }
  .ts-tripname{ font-size:23px; margin:0; }
  .ts-sync{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft); text-align:right; }
  .ts-sync .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--barcelona); margin-right:5px; }

  .ts-tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; }
  .ts-tab{ font-family:var(--font-mono); font-size:12px; letter-spacing:.02em; padding:8px 13px; border-radius:3px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); white-space:nowrap; cursor:pointer; }
  .ts-tab.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:600; }

  .ts-daytabs{ display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; }
  .ts-daytab{ font-family:var(--font-display); font-size:14px; font-weight:700; padding:7px 13px; border-radius:3px; background:var(--card); color:var(--ink); border:1px solid var(--line); cursor:pointer; white-space:nowrap; }
  .ts-daytab.active{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .ts-daytab.add{ color:var(--red); border-style:dashed; font-family:var(--font-body); font-weight:600; }

  .ts-section-title{ font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line); }

  /* ---- Item cards (postcard) ---- */
  .ts-item{ background:var(--card); color:var(--ink); border-radius:4px; padding:14px 16px; margin-bottom:10px; position:relative; border:1px solid var(--line); border-left:4px solid var(--madrid); }
  .ts-item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .ts-item-time{ font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--blue); min-width:50px; }
  .ts-item-title{ font-weight:700; font-size:15px; font-family:var(--font-display); }
  .ts-item-type{ font-family:var(--font-mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px; }
  .ts-item-note{ font-size:13px; color:var(--ink-soft); margin-top:6px; line-height:1.4; }
  .ts-del{ background:none; border:none; color:var(--red); font-size:18px; cursor:pointer; line-height:1; padding:2px 4px; }
  .ts-edit{ background:none; border:none; font-size:15px; cursor:pointer; line-height:1; padding:2px 6px; opacity:0.8; }
  .ts-divider{ border-top:1px dashed var(--line); margin:10px 0; }
  .ts-kv{ display:flex; justify-content:space-between; font-size:13px; margin-top:4px; }
  .ts-kv span:first-child{ color:var(--ink-soft); }
  .ts-kv span:last-child{ font-family:var(--font-mono); font-weight:600; }

  .ts-outfit-photo{ width:100%; max-height:260px; object-fit:cover; border-radius:3px; margin-bottom:8px; border:1px solid var(--line); }
  .ts-empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:30px 10px; font-style:italic; }

  .ts-fab{ position:fixed; bottom:calc(26px + env(safe-area-inset-bottom)); right:calc(50% - 240px + 20px); background:var(--red); color:#fff; border:3px solid var(--card); width:64px; height:64px; border-radius:50%; font-size:32px; line-height:1; cursor:pointer; box-shadow:0 8px 24px rgba(42,39,35,0.45); z-index:40; display:flex; align-items:center; justify-content:center; }
  @media (max-width:520px){ .ts-fab{ right:20px; bottom:calc(22px + env(safe-area-inset-bottom)); } }

  /* ---- Modal ---- */
  .ts-modal-bg{ position:fixed; inset:0; background:rgba(42,39,35,0.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; overflow-y:auto; }
  .ts-modal{ background:var(--paper); color:var(--ink); width:100%; max-width:480px; border-radius:10px; padding:22px 20px 26px; max-height:82vh; overflow-y:auto; border-top:3px solid var(--red); margin:auto; }
  .ts-modal h3{ font-family:var(--font-display); margin:0 0 14px; }
  .ts-label{ font-size:12px; font-weight:600; color:var(--ink-soft); margin:10px 0 4px; display:block; }
  .ts-row2{ display:flex; gap:8px; }
  .ts-row2 .ts-input{ flex:1; }
  .ts-close{ position:absolute; top:16px; right:18px; background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; }
</style>

<div id="tripsync-root">
  <div class="ts-wrap" id="ts-app"></div>
</div>

<script>
(function(){
  const root = document.getElementById('ts-app');
  let state = {
    screen: 'welcome', // welcome | join | app
    code: null,
    data: null,
    activeTab: 'itinerario',
    activeDay: 1,
    error: '',
    syncedAt: null,
    syncStatus: null,
    busy: false,
    editingId: null
  };
  const TYPE_LABELS = { hotel:'Hotel', lugar:'Lugar', calle:'Calle / Zona', actividad:'Actividad' };

  function emptyData(name){
    return {
      name: name || 'Mi viaje',
      days: [{id:1, label:'Día 1'}],
      itinerary: [],
      flights: [],
      hotels: [],
      outfits: [],
      packing: [],
      expenses: [],
      photospots: []
    };
  }

  function templateData(){
    const d = emptyData('Madrid - Barcelona - París');
    const days = ['23 sep','24 sep','25 sep','26 sep','27 sep','28 sep','29 sep','30 sep','1 oct','2 oct'];

  function genCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let c = '';
    for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
    return c;
  }

  const API = 'https://api.jsonstorage.net/v1/json/';

  function stripPhotos(data){
    const clone = JSON.parse(JSON.stringify(data));
    (clone.outfits||[]).forEach(o=>{ o.photo = null; });
    (clone.photospots||[]).forEach(p=>{ p.photo = null; });
    return clone;
  }

  function mergeLocalPhotos(remoteData, code){
    try{
      const raw = localStorage.getItem('cache:'+code);
      if(!raw) return remoteData;
      const local = JSON.parse(raw);
      const localOutfits = {}; (local.outfits||[]).forEach(o=>{ if(o.photo) localOutfits[o.id]=o.photo; });
      const localSpots = {}; (local.photospots||[]).forEach(p=>{ if(p.photo) localSpots[p.id]=p.photo; });
      (remoteData.outfits||[]).forEach(o=>{ if(!o.photo && localOutfits[o.id]) o.photo = localOutfits[o.id]; });
      (remoteData.photospots||[]).forEach(p=>{ if(!p.photo && localSpots[p.id]) p.photo = localSpots[p.id]; });
    }catch(e){}
    return remoteData;
  }

  function cacheLocally(){
    try{ localStorage.setItem('cache:'+state.code, JSON.stringify(state.data)); }catch(e){}
  }

  async function apiCreate(data){
    const res = await fetch(API.replace(/\/$/,''), {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(stripPhotos(data))
    });
    const json = await res.json();
    const uri = json.uri || '';
    const parts = uri.split('/v1/json/');
    return parts[1] || '';
  }

  async function apiFetch(code){
    const res = await fetch(API+code);
    if(!res.ok) return null;
    return await res.json();
  }

  async function apiUpdate(code, data){
    await fetch(API+code, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(stripPhotos(data))
    });
  }

  async function saveData(){
    cacheLocally();
    state.syncStatus = 'saving';
    try{
      await apiUpdate(state.code, state.data);
      state.syncStatus = 'ok';
      state.syncedAt = new Date();
    }catch(e){ state.syncStatus = 'error'; }
    render();
  }

  let pollHandle = null;
  function startPolling(){
    stopPolling();
    pollHandle = setInterval(async ()=>{
      try{
        const fresh = await apiFetch(state.code);
        if(fresh){ state.data = mergeLocalPhotos(fresh, state.code); cacheLocally(); state.syncedAt = new Date(); render(); }
      }catch(e){}
    }, 45000);
  }
  function stopPolling(){ if(pollHandle) clearInterval(pollHandle); pollHandle = null; }

  window.tsRefreshNow = async function(){
    state.syncStatus = 'saving';
    render();
    try{
      const fresh = await apiFetch(state.code);
      if(fresh){ state.data = mergeLocalPhotos(fresh, state.code); cacheLocally(); }
      state.syncStatus = 'ok'; state.syncedAt = new Date();
    }catch(e){ state.syncStatus = 'error'; }
    render();
  };

  function compressImage(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          const maxW = 700;
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width*scale;
          canvas.height = img.height*scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0,canvas.width,canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

    const inp = document.getElementById('ts-join-code');
    const code = (inp.value||'').trim();
    if(!code){ state.error='Ingresá el código del viaje.'; render(); return; }
    state.error=''; state.busy = true; render();
    try{
      const data = await apiFetch(code);
      if(!data){ state.error='No encontramos ese viaje. Revisá el código.'; state.busy=false; render(); return; }
      state.code = code;
      state.data = mergeLocalPhotos(data, code);
      if(!state.data.photospots) state.data.photospots = [];
      cacheLocally();
      state.screen='app'; state.activeDay = (state.data.days[0]||{}).id || 1;
      startPolling();

                <div class="ts-item-title">${escapeHtml(it.title)}</div>
                <div class="ts-item-type">${TYPE_LABELS[it.type]||it.type}</div>
              </div>
            </div>
            <button class="ts-edit" onclick="tsEditItem('itinerario','itinerary','${it.id}')">✏️</button><button class="ts-del" onclick="tsDelete('itinerary','${it.id}')">×</button>
          </div>
          ${it.note?`<div class="ts-item-note">${escapeHtml(it.note)}</div>`:''}
        </div>`).join('') : emptyMsg('Nada cargado para este día todavía.');
    }

    else if(state.activeTab==='vuelos'){
      html += `<div class="ts-section-title">Vuelos</div>`;
      html += d.flights.length ? d.flights.map(f=>`
        <div class="ts-item">
          <div class="ts-item-top">
            <div>
              <div class="ts-item-title">${escapeHtml(f.airline)} ${f.number?('· '+escapeHtml(f.number)):''}</div>
              <div class="ts-item-type">${escapeHtml(f.from)} → ${escapeHtml(f.to)}</div>
            </div>
            <button class="ts-edit" onclick="tsEditItem('vuelos','flights','${f.id}')">✏️</button><button class="ts-del" onclick="tsDelete('flights','${f.id}')">×</button>
          </div>
          <div class="ts-divider"></div>
          <div class="ts-kv"><span>Fecha</span><span>${f.date||'-'}</span></div>
          <div class="ts-kv"><span>Salida</span><span>${f.dep||'-'}</span></div>
          <div class="ts-kv"><span>Llegada</span><span>${f.arr||'-'}</span></div>
        </div>`).join('') : emptyMsg('Todavía no cargaste vuelos.');
    }

    else if(state.activeTab==='hoteles'){
      html += `<div class="ts-section-title">Hoteles</div>`;
      html += d.hotels.length ? d.hotels.map(h=>`
        <div class="ts-item">
          <div class="ts-item-top">
            <div>
              <div class="ts-item-title">${escapeHtml(h.name)}</div>
              <div class="ts-item-type">${escapeHtml(h.address||'')}</div>
            </div>
            <button class="ts-edit" onclick="tsEditItem('hoteles','hotels','${h.id}')">✏️</button><button class="ts-del" onclick="tsDelete('hotels','${h.id}')">×</button>
          </div>
          <div class="ts-divider"></div>
          <div class="ts-kv"><span>Check-in</span><span>${h.checkin||'-'}</span></div>
          <div class="ts-kv"><span>Check-out</span><span>${h.checkout||'-'}</span></div>
          ${h.note?`<div class="ts-item-note">${escapeHtml(h.note)}</div>`:''}
        </div>`).join('') : emptyMsg('Todavía no cargaste hoteles.');
    }

    else if(state.activeTab==='outfits'){
      const items = d.outfits.filter(o=>o.day===state.activeDay);
      html += `<div class="ts-section-title">Outfits</div>`;
      const oColor = cityColor(state.activeDay);
      html += items.length ? items.map(o=>`
        <div class="ts-item" style="border-left-color:${oColor};">
          <div class="ts-item-top">
            <div style="flex:1;">
              ${o.photo?`<img class="ts-outfit-photo" src="${o.photo}" />`:''}
              ${o.note?`<div class="ts-item-note">${escapeHtml(o.note)}</div>`:''}
            </div>
            <button class="ts-edit" onclick="tsEditItem('outfits','outfits','${o.id}')">✏️</button><button class="ts-del" onclick="tsDelete('outfits','${o.id}')">×</button>
          </div>
        </div>`).join('') : emptyMsg('Sin outfits cargados para este día.');
    }

    else if(state.activeTab==='equipaje'){
      html += `<div class="ts-section-title">Checklist de equipaje</div>`;
      html += d.packing.length ? d.packing.map(p=>`
        <div class="ts-item" style="display:flex;align-items:center;gap:10px;">
          <input type="checkbox" ${p.done?'checked':''} onchange="tsTogglePack('${p.id}')" style="width:18px;height:18px;" />
          <div style="flex:1; ${p.done?'text-decoration:line-through;color:#9aa2b1;':''}">${escapeHtml(p.label)}</div>
          <button class="ts-edit" onclick="tsEditPack('${p.id}')">✏️</button><button class="ts-del" onclick="tsDelete('packing','${p.id}')">×</button>
        </div>`).join('') : emptyMsg('Lista vacía por ahora.');
      html += `
        <div class="ts-card" style="margin-top:10px;">
          ${state.editingPackId?'<div style="font-size:12px;color:var(--red);margin-bottom:6px;">Editando ítem…</div>':''}
          <div class="ts-row2">
            <input class="ts-input" id="f-pack" placeholder="Ej: cargador, protector solar…" style="margin-bottom:0;" />
            <button class="ts-btn ts-btn-teal" style="width:auto; padding:0 16px;" onclick="tsSubmitPack()">${state.editingPackId?'✓':'+'}</button>
          </div>
        </div>`;
    }

    else if(state.activeTab==='gastos'){
      const total = d.expenses.reduce((s,e)=>s+e.amount,0);
      html += `<div class="ts-section-title">Gastos</div>`;
      html += `<div class="ts-item" style="text-align:center;"><div class="ts-item-type">Total cargado</div><div style="font-family:var(--font-mono);font-size:26px;font-weight:600;">$${total.toFixed(2)}</div></div>`;
      html += d.expenses.length ? d.expenses.map(e=>`
        <div class="ts-item">
          <div class="ts-item-top">
            <div>
              <div class="ts-item-title">${escapeHtml(e.label)}</div>
              <div class="ts-item-type">${escapeHtml(e.who)}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="font-family:var(--font-mono);font-weight:600;">$${e.amount.toFixed(2)}</div>
              <button class="ts-edit" onclick="tsEditItem('gastos','expenses','${e.id}')">✏️</button><button class="ts-del" onclick="tsDelete('expenses','${e.id}')">×</button>
            </div>
          </div>
        </div>`).join('') : emptyMsg('Sin gastos cargados.');
    }

    else if(state.activeTab==='fotos'){
      html += `<div class="ts-section-title">Fotos que sí o sí</div>`;
      const CITY_LABEL = {madrid:'Madrid', barcelona:'Barcelona', paris:'París'};
      const CITY_COL = {madrid:'var(--madrid)', barcelona:'var(--barcelona)', paris:'var(--paris)'};
      html += d.photospots.length ? d.photospots.map(p=>`
        <div class="ts-item" style="border-left-color:${CITY_COL[p.city]||'var(--madrid)'};">
          <div class="ts-item-top">
            <div style="flex:1;">
              <div class="ts-item-title">${escapeHtml(p.place)}</div>
              <div class="ts-item-type">${CITY_LABEL[p.city]||''}</div>
              ${p.photo?`<img class="ts-outfit-photo" style="margin-top:8px;" src="${p.photo}" />`:''}
              ${p.tip?`<div class="ts-item-note" style="margin-top:6px;"><strong>Cómo lograrla:</strong> ${escapeHtml(p.tip)}</div>`:''}
              ${p.note?`<div class="ts-item-note">${escapeHtml(p.note)}</div>`:''}
            </div>
            <button class="ts-edit" onclick="tsEditItem('fotos','photospots','${p.id}')">✏️</button><button class="ts-del" onclick="tsDelete('photospots','${p.id}')">×</button>
          </div>
        </div>`).join('') : emptyMsg('Todavía no agregaste lugares para fotos.');
    }

    el.innerHTML = html;

    if(state.activeTab!=='equipaje'){
      el.innerHTML += `<button class="ts-fab" onclick="tsOpenModal('${state.activeTab}')">+</button>`;
    }

    if(state.modal){ renderModal(); }
  }

  function cityColor(dayId){
    const label = (state.data.days.find(x=>x.id===dayId)||{}).label || '';
    const barcelona = ['26 sep','27 sep'];
    const paris = ['28 sep','29 sep','30 sep','1 oct','2 oct'];
    if(barcelona.includes(label)) return 'var(--barcelona)';
    if(paris.includes(label)) return 'var(--paris)';
    return 'var(--madrid)';
  }

  function emptyMsg(t){ return `<div class="ts-empty">${t}</div>`; }
  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

  function renderModal(){
    const wrap = document.createElement('div');
    wrap.className = 'ts-modal-bg';
    wrap.onclick = (e)=>{ if(e.target===wrap) window.tsCloseModal(); };
    let inner = '';

    if(state.modal==='itinerario'){
      const ed = state.editingId ? state.data.itinerary.find(x=>x.id===state.editingId) : null;
      inner = `
        <h3>${ed?'Editar ítem':'Agregar al itinerario'}</h3>
        <label class="ts-label">Tipo</label>
        <select class="ts-input" id="f-type">
          <option value="hotel" ${ed&&ed.type==='hotel'?'selected':''}>Hotel</option>
          <option value="lugar" ${ed&&ed.type==='lugar'?'selected':''}>Lugar</option>
          <option value="calle" ${ed&&ed.type==='calle'?'selected':''}>Calle / Zona</option>
          <option value="actividad" ${ed&&ed.type==='actividad'?'selected':''}>Actividad</option>
        </select>
        <div class="ts-row2">
          <div style="flex:1;"><label class="ts-label">Hora</label><input class="ts-input" id="f-time" type="time" value="${ed?ed.time||'':''}" /></div>
          <div style="flex:2;"><label class="ts-label">Título</label><input class="ts-input" id="f-title" placeholder="Ej: Museo Larco" value="${ed?escapeHtml(ed.title):''}" /></div>
        </div>
        <label class="ts-label">Nota (opcional)</label>
        <input class="ts-input" id="f-note" placeholder="Reservar antes, llevar efectivo…" value="${ed?escapeHtml(ed.note||''):''}" />
        <button class="ts-btn ts-btn-gold" onclick="tsSubmitItinerary()">${ed?'Guardar cambios':'Guardar'}</button>`;
    }
    else if(state.modal==='vuelos'){
      const ed = state.editingId ? state.data.flights.find(x=>x.id===state.editingId) : null;
      inner = `
        <h3>${ed?'Editar vuelo':'Agregar vuelo'}</h3>
        <div class="ts-row2">
          <div style="flex:2;"><label class="ts-label">Aerolínea</label><input class="ts-input" id="f-airline" placeholder="Ej: Aerolíneas Argentinas" value="${ed?escapeHtml(ed.airline):''}" /></div>
          <div style="flex:1;"><label class="ts-label">N° vuelo</label><input class="ts-input" id="f-number" placeholder="AR1234" value="${ed?escapeHtml(ed.number||''):''}" /></div>
        </div>
        <div class="ts-row2">
          <div style="flex:1;"><label class="ts-label">Origen</label><input class="ts-input" id="f-from" placeholder="EZE" value="${ed?escapeHtml(ed.from||''):''}" /></div>
          <div style="flex:1;"><label class="ts-label">Destino</label><input class="ts-input" id="f-to" placeholder="BRC" value="${ed?escapeHtml(ed.to||''):''}" /></div>
        </div>
        <label class="ts-label">Fecha</label>
        <input class="ts-input" id="f-date" type="date" value="${ed?ed.date||'':''}" />
        <div class="ts-row2">
          <div style="flex:1;"><label class="ts-label">Salida</label><input class="ts-input" id="f-dep" type="time" value="${ed?ed.dep||'':''}" /></div>
          <div style="flex:1;"><label class="ts-label">Llegada</label><input class="ts-input" id="f-arr" type="time" value="${ed?ed.arr||'':''}" /></div>
        </div>
        <button class="ts-btn ts-btn-gold" onclick="tsSubmitFlight()">${ed?'Guardar cambios':'Guardar'}</button>`;
    }
    else if(state.modal==='hoteles'){
      const ed = state.editingId ? state.data.hotels.find(x=>x.id===state.editingId) : null;
      inner = `
        <h3>${ed?'Editar hotel':'Agregar hotel'}</h3>
        <label class="ts-label">Nombre</label>
        <input class="ts-input" id="f-hname" placeholder="Ej: Hotel Panamericano" value="${ed?escapeHtml(ed.name):''}" />
        <label class="ts-label">Dirección</label>
        <input class="ts-input" id="f-haddr" placeholder="Calle y número" value="${ed?escapeHtml(ed.address||''):''}" />
        <div class="ts-row2">
          <div style="flex:1;"><label class="ts-label">Check-in</label><input class="ts-input" id="f-hin" type="date" value="${ed?ed.checkin||'':''}" /></div>
          <div style="flex:1;"><label class="ts-label">Check-out</label><input class="ts-input" id="f-hout" type="date" value="${ed?ed.checkout||'':''}" /></div>
        </div>
        <label class="ts-label">Nota (opcional)</label>
        <input class="ts-input" id="f-hnote" placeholder="Código de reserva, wifi…" value="${ed?escapeHtml(ed.note||''):''}" />
        <button class="ts-btn ts-btn-gold" onclick="tsSubmitHotel()">${ed?'Guardar cambios':'Guardar'}</button>`;
    }
    else if(state.modal==='outfits'){
      const ed = state.editingId ? state.data.outfits.find(x=>x.id===state.editingId) : null;
      inner = `
        <h3>${ed?'Editar outfit':'Agregar outfit'} — ${escapeHtml((state.data.days.find(x=>x.id===state.activeDay)||{}).label||'')}</h3>
        ${ed&&ed.photo?`<img class="ts-outfit-photo" src="${ed.photo}" style="margin-bottom:8px;" />`:''}
        <label class="ts-label">${ed?'Reemplazar foto (opcional)':'Foto'}</label>
        <input class="ts-input" id="f-photo" type="file" accept="image/*" />
        <label class="ts-label">Nota (opcional)</label>
        <input class="ts-input" id="f-onote" placeholder="Ej: para la cena, llevar campera" value="${ed?escapeHtml(ed.note||''):''}" />
        <button class="ts-btn ts-btn-gold" onclick="tsSubmitOutfit()">${ed?'Guardar cambios':'Guardar'}</button>`;
    }
    else if(state.modal==='gastos'){
      const ed = state.editingId ? state.data.expenses.find(x=>x.id===state.editingId) : null;
      inner = `
        <h3>${ed?'Editar gasto':'Agregar gasto'}</h3>
        <label class="ts-label">Concepto</label>
        <input class="ts-input" id="f-exlabel" placeholder="Ej: Cena día 2" value="${ed?escapeHtml(ed.label):''}" />
        <div class="ts-row2">
          <div style="flex:1;"><label class="ts-label">Monto</label><input class="ts-input" id="f-examount" type="number" step="0.01" placeholder="0.00" value="${ed?ed.amount:''}" /></div>
          <div style="flex:1;"><label class="ts-label">Quién pagó</label><input class="ts-input" id="f-exwho" placeholder="Nombre" value="${ed?escapeHtml(ed.who||''):''}" /></div>
        </div>
        <button class="ts-btn ts-btn-gold" onclick="tsSubmitExpense()">${ed?'Guardar cambios':'Guardar'}</button>`;
    }
    else if(state.modal==='fotos'){
      const ed = state.editingId ? state.data.photospots.find(x=>x.id===state.editingId) : null;
      inner = `
        <h3>${ed?'Editar lugar para foto':'Agregar lugar para foto'}</h3>
        <label class="ts-label">Ciudad</label>
        <select class="ts-input" id="f-pcity">
          <option value="madrid" ${ed&&ed.city==='madrid'?'selected':''}>Madrid</option>
          <option value="barcelona" ${ed&&ed.city==='barcelona'?'selected':''}>Barcelona</option>
          <option value="paris" ${ed&&ed.city==='paris'?'selected':''}>París</option>
        </select>
        <label class="ts-label">Lugar</label>
        <input class="ts-input" id="f-pplace" placeholder="Ej: Rue Crémieux" value="${ed?escapeHtml(ed.place):''}" />
        ${ed&&ed.photo?`<img class="ts-outfit-photo" src="${ed.photo}" style="margin:6px 0;" />`:''}
        <label class="ts-label">${ed?'Reemplazar foto (opcional)':'Foto modelo / inspiración (opcional)'}</label>
        <input class="ts-input" id="f-pphoto" type="file" accept="image/*" />
        <label class="ts-label">Cómo lograrla (opcional)</label>
        <input class="ts-input" id="f-ptip" placeholder="Ej: ir temprano, pararse en el medio de la calle" value="${ed?escapeHtml(ed.tip||''):''}" />
        <button class="ts-btn ts-btn-gold" onclick="tsSubmitPhoto()">${ed?'Guardar cambios':'Guardar'}</button>`;
    }

    wrap.innerHTML = `<div class="ts-modal" style="position:relative;"><button class="ts-close" onclick="tsCloseModal()">×</button>${inner}</div>`;
    document.getElementById('tripsync-root').appendChild(wrap);
  }

  document.addEventListener('focusin', function(e){
    const tag = e.target.tagName;
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT'){
      setTimeout(function(){
        try{ e.target.scrollIntoView({block:'center', behavior:'smooth'}); }catch(err){}
      }, 300);
    }
  });

  render();
})();
</script>

</body>
</html>
